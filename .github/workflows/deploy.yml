name: Build, Push & Deploy

# Kích hoạt khi push lên nhánh main, hoặc chạy tay từ GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository tự động = <owner>/<repo> — không cần thay thủ công
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build Docker image và push lên GitHub Container Registry (GHCR)
  # ─────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # cần để push lên ghcr.io

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN tự động có quyền push packages trong repo này
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tag cả :latest (rolling) lẫn :<sha> (rollback dễ dàng)
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # GitHub Actions cache — tăng tốc build lần sau
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: SSH vào VPS — pull image mới và restart container
  # Chạy SAU khi build-push thành công
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-push   # đợi image được push xong mới deploy

    steps:
      - name: SSH & Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # VPS_PORT mặc định 22 nếu secret không được set
          port: ${{ secrets.VPS_PORT || '22' }}
          # Script chạy trên VPS:
          # 1. Vào thư mục chứa docker-compose.yml + .env
          # 2. Pull image mới nhất từ GHCR
          # 3. Restart container (giữ .env hiện tại)
          # 4. Dọn image cũ không dùng nữa
          script: |
            set -e
            cd ~/deploy
            echo "Pulling new image..."
            docker compose pull
            echo "Restarting container..."
            docker compose up -d
            echo "Pruning old images..."
            docker image prune -f
            echo "Deploy complete. Container status:"
            docker compose ps
